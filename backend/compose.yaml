services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brewed_tales
      POSTGRES_USER: brewed_tales
      POSTGRES_PASSWORD: brewed_tales_dev
    ports:
      - "5432:5432"
    volumes:
      - brewed_tales_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewed_tales -d brewed_tales"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brewed_tales_postgres_data:
